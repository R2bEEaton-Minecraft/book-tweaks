# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
# The Gradle JVM is pinned to Java 25 via gradle/gradle-daemon-jvm.properties;
# Minecraft 26.1+ compiles with --release 25 and cannot build on an older JDK.

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Minecraft Version
mc_ver=1.21.10

# Plugin Versions
loom_version=1.15.5
manifold_version=2026.1.3

# Mod Properties
mod_version=1.2.0
maven_group=cc.spea.booktweaks
archives_base_name=book-tweaks
