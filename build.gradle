plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'xyz.wagyourtail.manifold' version "${manifold_plugin_version}"
	id 'maven-publish'
}

version = "${project.mod_version}-${gradle.ext.minecraft_version}"
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-${gradle.ext.minecraft_version}"
}

repositories {
	mavenCentral()
}

manifold {
	version = manifold_version
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"book-tweaks" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	minecraft "com.mojang:minecraft:${gradle.ext.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${gradle.ext.fabric_loader}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${gradle.ext.fabric_api_version}"

	annotationProcessor(manifold.module("preprocessor"))
	annotationProcessor(manifold.module("strings"))
}

def buildPropertiesFile = layout.projectDirectory.file("build.properties").asFile
def writeBuildProperties = tasks.register("writeBuildProperties") {
	outputs.file(buildPropertiesFile)
	inputs.property("mcIndex", gradle.ext.mcIndex)
	inputs.property("mcVers", gradle.ext.mcVers.join(","))

	doLast {
		StringBuilder sb = new StringBuilder()
		sb.append("# Preprocessor definitions generated by build script\n")

		gradle.ext.mcVers.eachWithIndex { ver, idx ->
			sb.append("MC_${ver.replace('.', '_')}=${idx}\n")
			if (gradle.ext.mcIndex == idx) {
				sb.append("MC_VER=${idx}\n")
			}
		}

		buildPropertiesFile.text = sb.toString()
	}
}

def lateTextFieldMixins = gradle.ext.mcIndex >= gradle.ext.mcVers.indexOf("1.21.6")
	? ",\n\t\t\"MultiLineEditBoxMixin\",\n\t\t\"MultilineTextFieldMixin\""
	: ""
def resourceExpandProps = [
	version: project.version,
	loader_version: gradle.ext.fabric_loader,
	minecraft_version: gradle.ext.minecraft_version,
	late_text_field_mixins: lateTextFieldMixins
]

processResources {
	filesMatching(["fabric.mod.json", "book-tweaks.client.mixins.json"]) {
		expand resourceExpandProps
	}

	inputs.properties(resourceExpandProps)
}

tasks.named("processClientResources") {
	filesMatching("book-tweaks.client.mixins.json") {
		expand resourceExpandProps
	}

	inputs.properties(resourceExpandProps)
}

tasks.withType(JavaCompile).configureEach {
	dependsOn(writeBuildProperties)
	it.options.release = 21
}

tasks.matching { it.name == "remapSourcesJar" }.configureEach {
	enabled = false
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(gradle.ext.java_version)
	targetCompatibility = JavaVersion.toVersion(gradle.ext.java_version)
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
