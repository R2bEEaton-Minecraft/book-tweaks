buildscript {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
	}

	dependencies {
		classpath "net.fabricmc:fabric-loom:${loom_version}"
	}
}

plugins {
	id 'maven-publish'
}

def usesUnobfuscatedLoom = gradle.ext.minecraft_version.tokenize('.').first().toInteger() >= 26

apply plugin: usesUnobfuscatedLoom ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

version = "${project.mod_version}-${gradle.ext.minecraft_version}"
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-${gradle.ext.minecraft_version}"
}

repositories {
	mavenCentral()
	maven {
		url = 'https://maven.wagyourtail.xyz/releases'
	}
	maven {
		url = 'https://maven.wagyourtail.xyz/snapshots'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"book-tweaks" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	minecraft "com.mojang:minecraft:${gradle.ext.minecraft_version}"
	if (!usesUnobfuscatedLoom) {
		mappings loom.officialMojangMappings()
	}

	def fabricLoaderNotation = "net.fabricmc:fabric-loader:${gradle.ext.fabric_loader}"
	def fabricApiNotation = "net.fabricmc.fabric-api:fabric-api:${gradle.ext.fabric_api_version}"
	if (usesUnobfuscatedLoom) {
		implementation fabricLoaderNotation
		implementation fabricApiNotation
	} else {
		modImplementation fabricLoaderNotation
		modImplementation fabricApiNotation
	}

	annotationProcessor "systems.manifold:manifold-preprocessor:${manifold_version}"
	annotationProcessor "systems.manifold:manifold-strings:${manifold_version}"
}

def buildPropertiesFile = layout.projectDirectory.file("build.properties").asFile
def writeBuildProperties = tasks.register("writeBuildProperties") {
	outputs.file(buildPropertiesFile)
	inputs.property("mcIndex", gradle.ext.mcIndex)
	inputs.property("mcVers", gradle.ext.mcVers.join(","))

	doLast {
		StringBuilder sb = new StringBuilder()
		sb.append("# Preprocessor definitions generated by build script\n")

		gradle.ext.mcVers.eachWithIndex { ver, idx ->
			sb.append("MC_${ver.replace('.', '_')}=${idx}\n")
			if (gradle.ext.mcIndex == idx) {
				sb.append("MC_VER=${idx}\n")
			}
		}

		buildPropertiesFile.text = sb.toString()
	}
}

def lateTextFieldMixins = gradle.ext.mcIndex >= gradle.ext.mcVers.indexOf("1.21.6")
	? ",\n\t\t\"MultiLineEditBoxMixin\",\n\t\t\"MultilineTextFieldMixin\""
	: ""
def resourceExpandProps = [
	version: project.version,
	loader_version: gradle.ext.fabric_loader,
	minecraft_version: gradle.ext.minecraft_version,
	late_text_field_mixins: lateTextFieldMixins
]

processResources {
	filesMatching(["fabric.mod.json", "book-tweaks.client.mixins.json"]) {
		expand resourceExpandProps
	}

	inputs.properties(resourceExpandProps)
}

tasks.named("processClientResources") {
	filesMatching("book-tweaks.client.mixins.json") {
		expand resourceExpandProps
	}

	inputs.properties(resourceExpandProps)
}

tasks.withType(JavaCompile).configureEach {
	dependsOn(writeBuildProperties)
	it.options.release = gradle.ext.java_version.toInteger()
	if (!it.options.compilerArgs.contains("-Xplugin:Manifold")) {
		it.options.compilerArgs.add("-Xplugin:Manifold")
	}
}

tasks.matching { it.name == "remapSourcesJar" }.configureEach {
	enabled = false
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(gradle.ext.java_version)
	targetCompatibility = JavaVersion.toVersion(gradle.ext.java_version)
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
